service: my-service
provider:
  name: ddb
  tableName: my-service-${stage}

stacks:
  - custom-resources-${stage}
  - test

config:
  path: /${stage}/config
  defaults:
    DB_NAME: my-database
    DB_HOST: 3200
  required:
    DB_TABLE: "some database table name for ${stage}"

secret:
  keyId: arn:aws:kms:us-east-1:XXXXXXXXXXXX:key/XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
  path: /${stage}/secret
  required:
    DB_PASSWORD: "secret database password"
